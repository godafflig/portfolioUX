# Mise en ligne automatique sur GitHub Pages.
# À chaque envoi sur la branche main, GitHub compile le site (npm run build)
# et publie le dossier dist/ sur https://tombenat.fr
name: Mise en ligne

on:
  push:
    branches: [main]
  # Permet aussi de relancer la mise en ligne à la main depuis l'onglet « Actions »
  workflow_dispatch:

# Droits nécessaires pour publier sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule mise en ligne à la fois : la plus récente annule celle en attente
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
